name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: corepack enable

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
          cache-workspaces: src-tauri

      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm quality
      - run: corepack pnpm test
      - run: corepack pnpm rust:test

  kit:
    name: USB kit scripts
    runs-on: windows-latest
    defaults:
      run:
        # Windows PowerShell 5.1 is what the kit runs on, so test with it rather than pwsh.
        shell: powershell
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install PSScriptAnalyzer
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force

      - name: Analyze kit scripts
        run: Invoke-ScriptAnalyzer -Path installer-kit -Recurse -Severity Error -EnableExit

      # Unit checks plus the full install, idempotency, early check and expiry path with a
      # 0.01 h (36 s) window and a throwaway certificate. Test-Kit removes its own trust in a finally block.
      - name: Test the kit end to end
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer-kit\tests\Test-Kit.ps1 -Full
