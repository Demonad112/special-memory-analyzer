name: Build installer

# Builds the NSIS installer when a v* tag is pushed, keeps it as a workflow artifact,
# and publishes it as a GitHub Release.
# The tag must match the version in package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check tag against version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          want="${want%%-*}"
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$tauri" != "$want" ] || [ "$pkg" != "$want" ] || [ "$cargo" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME needs version $want, but tauri.conf.json has $tauri, package.json has $pkg and Cargo.toml has $cargo."
            exit 1
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: corepack enable

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-workspaces: src-tauri

      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm tauri build

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Deep-Server-Analyzer-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: installer
    runs-on: ubuntu-latest
    # actions: read is required to download the installer artifact from this run.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Deep-Server-Analyzer-windows --dir installer

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Deep Server Analyzer $GITHUB_REF_NAME" \
            --generate-notes
